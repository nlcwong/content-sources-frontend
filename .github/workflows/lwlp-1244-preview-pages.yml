name: Deploy LWLP-1244 preview

on:
  push:
    branches:
      - feature/lwlp-1244-beacon-closed-resolutions
    paths:
      - 'preview/**'
      - 'src/Pages/Lightwell/Beacon/**'
      - '.github/workflows/lwlp-1244-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lwlp-1244-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: preview/package-lock.json

      - name: Install and build preview
        working-directory: preview
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview/dist
          publish_branch: gh-pages
          destination_dir: closed-resolutions
          keep_files: true
          commit_message: 'Deploy LWLP-1244 Beacon closed-resolutions preview'
