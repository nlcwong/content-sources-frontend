name: Deploy Lightwell preview

on:
  push:
    branches:
      - feature/lightwell-recent-release-stats
    paths:
      - 'preview/**'
      - 'src/Pages/Lightwell/**'
      - '.github/workflows/lightwell-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lightwell-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: preview/package-lock.json

      - name: Install and build preview
        working-directory: preview
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
